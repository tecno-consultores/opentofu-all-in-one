networks:
  opentofu:
    enable_ipv6: true
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: 1

services:
  opentofu:
    image: sinfallas/opentofu-all-in-one:latest
    hostname: opentofu
    container_name: opentofu
    pull_policy: always
    restart: always
    ports:
      - 3000:3000
    environment:
      - AWS_ACCESS_KEY_ID=XXXXXXXXXXXXXXXXXXXXXXXXXXX
      - AWS_SECRET_ACCESS_KEY=XXXXXXXXXXXXXXXXXXXX
      - AWS_DEFAULT_REGION=XXXXXXXXXXXX
    volumes:
#      - ./config.json:/etc/semaphore/config.json
      - ./semaphore_data:/app
      - ./recursos:/recursos
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - opentofu
